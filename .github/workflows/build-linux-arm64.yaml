# Disabled in Actuna Mail (compliance/v0.1).
#
# Original purpose: build Linux ARM64 .deb package, code-sign with
# Foundry's certs, upload to AWS S3 distribution bucket.
# Reasons for disabling:
#   1. We do not have Foundry's secrets (AWS_*, codesign keys); workflow
#      would fail noisily on every dispatch.
#   2. Distribution channel updates.getmailspring.com is intentionally
#      cut in v0.1 (see README.md, COMPLIANCE.md).
#   3. Actuna's own build pipeline lands in v0.3.
#   4. Defense-in-depth: GitHub Actions are also disabled at repo level
#      (Settings -> Actions -> Actions permissions -> Disable actions).
#
# DO NOT add triggers (push, pull_request) without a matching audit
# entry in COMPLIANCE.md. Manual workflow_dispatch is retained only
# so this file remains schema-valid; the job is gated by `if: false`
# and cannot execute.

name: build-linux-arm64-disabled

on:
  workflow_dispatch:

jobs:
  noop:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "This workflow is disabled. See header comment."
